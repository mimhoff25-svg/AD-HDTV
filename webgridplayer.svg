<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#2196F3" stroke="#1976D2" stroke-width="2"/>
  
  <!-- Grid pattern (2x2) -->
  <!-- Top-left video -->
  <rect x="10" y="10" width="18" height="13" rx="2" fill="#FFF" opacity="0.9"/>
  <rect x="12" y="12" width="14" height="9" fill="#FF5722"/>
  <polygon points="17,15 17,19 20,17" fill="#FFF"/>
  
  <!-- Top-right video -->
  <rect x="36" y="10" width="18" height="13" rx="2" fill="#FFF" opacity="0.9"/>
  <rect x="38" y="12" width="14" height="9" fill="#4CAF50"/>
  <polygon points="43,15 43,19 46,17" fill="#FFF"/>
  
  <!-- Bottom-left video -->
  <rect x="10" y="36" width="18" height="13" rx="2" fill="#FFF" opacity="0.9"/>
  <rect x="12" y="38" width="14" height="9" fill="#FF9800"/>
  <polygon points="17,41 17,45 20,43" fill="#FFF"/>
  
  <!-- Bottom-right video -->
  <rect x="36" y="36" width="18" height="13" rx="2" fill="#FFF" opacity="0.9"/>
  <rect x="38" y="38" width="14" height="9" fill="#9C27B0"/>
  <polygon points="43,41 43,45 46,43" fill="#FFF"/>
  
  <!-- Web/network symbol in center -->
  <circle cx="32" cy="32" r="6" fill="#FFF" opacity="0.8"/>
  <circle cx="32" cy="32" r="4" fill="none" stroke="#1976D2" stroke-width="1"/>
  <circle cx="32" cy="32" r="1.5" fill="#1976D2"/>
  
  <!-- Connection lines -->
  <line x1="26" y1="32" x2="22" y2="32" stroke="#1976D2" stroke-width="1" opacity="0.6"/>
  <line x1="38" y1="32" x2="42" y2="32" stroke="#1976D2" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="26" x2="32" y2="22" stroke="#1976D2" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="38" x2="32" y2="42" stroke="#1976D2" stroke-width="1" opacity="0.6"/>
</svg>